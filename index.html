<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список дел</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>📝 Список дел</h1>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Введите задачу..."
        autocomplete="off"
        maxlength="120"
      />
      <button type="submit" id="add-btn">Добавить</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Выполненные</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <div class="footer">
      <span id="counter">Невыполнено: 0 задач</span>
      <button id="clear-completed" class="clear-btn">Очистить выполненные</button>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
